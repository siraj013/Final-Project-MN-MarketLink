<!DOCTYPE html>
<html>
<head>
    <title>Search Products</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
    <h1>MN MarketLink</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/markets">Markets</a>
        <a href="/search">Search Products</a>
    </nav>
</header>

<h2>Search Products</h2>

<form method="GET">
    <input name="q" value="{{ q }}" placeholder="Search for products...">
    <button>Search</button>
</form>

{% if results %}
<h3>Results:</h3>
{% for r in results %}
<div class="product-card">
    <h3>{{ r.product_name }}</h3>
    <p>Price: ${{ r.price }}</p>
    <p>Vendor: {{ r.vendor_name }}</p>
    <p>Market: {{ r.market_name }}</p>
</div>
{% endfor %}
{% else %}
<p>No products found.</p>
{% endif %}

</body>
</html>
